<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 340px; margin: 0; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; background: #fff; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #f7f7f8; border-bottom: 1px solid #eee; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; flex: none; }
    .dot.on { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.6); }
    .dot.off { background: #ef4444; }
    h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .meta { color: #888; font-size: 11px; margin-left: auto; }
    .row { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
    .row .label { color: #888; font-size: 11px; margin-bottom: 2px; }
    .row .value { word-break: break-all; color: #222; }
    .row .value.muted { color: #999; }
    
    /* 运行中 Agent 区域 */
    .agents-section { background: #fafafa; border-bottom: 1px solid #eee; }
    .agents-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; font-size: 11px; font-weight: 600; color: #475569; }
    .badge-count { background: #2f54eb; color: #fff; border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: 600; }
    .agent-item { padding: 8px 14px; border-top: 1px dashed #e2e8f0; background: #fff; }
    .agent-item:first-child { border-top: 1px solid #eee; }
    .agent-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .agent-tag { background: #e0e7ff; color: #3730a3; padding: 2px 7px; border-radius: 4px; font-weight: 600; font-size: 11px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-tab-badge { font-size: 11px; color: #64748b; }
    .agent-tab-title { font-weight: 500; font-size: 12px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-tab-url { font-size: 11px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .no-agents { padding: 9px 14px; color: #94a3b8; font-size: 12px; font-style: italic; }

    .actions { display: flex; gap: 8px; padding: 10px 14px; }
    button { flex: 1; padding: 7px 0; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
    button:hover { background: #f5f5f5; }
    button.primary { background: #2f54eb; border-color: #2f54eb; color: #fff; }
    button.primary:hover { background: #1d39c4; }
    .err { color: #dc2626; padding: 6px 14px 10px; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Agent Browser Bridge</h1>
    <span class="meta" id="version"></span>
  </header>

  <div class="row">
    <div class="label">Relay 连接</div>
    <div class="value" id="conn">检测中…</div>
  </div>

  <!-- 接管中的 Agent 与标签页 -->
  <div class="agents-section">
    <div class="agents-header">
      <span>正在操作的 Agent</span>
      <span class="badge-count" id="agentCount" style="display:none;">0</span>
    </div>
    <div id="agentsList">
      <div class="no-agents">当前无 Agent 在操作标签页</div>
    </div>
  </div>

  <div class="row">
    <div class="label">当前活动标签页 (聚焦中)</div>
    <div class="value muted" id="tab">—</div>
  </div>

  <div class="actions">
    <button id="btnRefresh">刷新</button>
    <button id="btnShot">截当前页</button>
    <button id="btnOptions" class="primary">设置</button>
  </div>
  <div class="err" id="err"></div>

  <script src="popup.js"></script>
</body>
</html>
