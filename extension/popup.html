<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; margin: 0; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; background: #fff; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #f7f7f8; border-bottom: 1px solid #eee; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; flex: none; }
    .dot.on { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.6); }
    .dot.off { background: #ef4444; }
    h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .meta { color: #888; font-size: 11px; margin-left: auto; }
    .row { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
    .row .label { color: #888; font-size: 11px; margin-bottom: 2px; }
    .row .value { word-break: break-all; color: #222; }
    .row .value.muted { color: #999; }
    .actions { display: flex; gap: 8px; padding: 10px 14px; }
    button { flex: 1; padding: 7px 0; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
    button:hover { background: #f5f5f5; }
    button.primary { background: #2f54eb; border-color: #2f54eb; color: #fff; }
    button.primary:hover { background: #1d39c4; }
    .err { color: #dc2626; padding: 6px 14px 10px; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Agent Browser Bridge</h1>
    <span class="meta" id="version"></span>
  </header>

  <div class="row">
    <div class="label">Relay 连接</div>
    <div class="value" id="conn">检测中…</div>
  </div>
  <div class="row">
    <div class="label">活动标签页</div>
    <div class="value muted" id="tab">—</div>
  </div>

  <div class="actions">
    <button id="btnRefresh">刷新</button>
    <button id="btnShot">截当前页</button>
    <button id="btnOptions" class="primary">设置</button>
  </div>
  <div class="err" id="err"></div>

  <script src="popup.js"></script>
</body>
</html>
